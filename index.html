<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111827;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            width: min(500px, 90%);
            text-align: center;
            padding: 40px;
            background: #1f2937;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,.35);
        }

        h1 {
            margin-top: 0;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 12px 28px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            cursor: wait;
            opacity: .6;
        }

        #result {
            margin-top: 25px;
            text-align: left;
            word-break: break-word;
            line-height: 1.7;
        }

        .error {
            color: #ff8080;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Generator</h1>

    <button id="generate">Generate</button>

    <div id="result"></div>
</div>

<script>
const button = document.getElementById("generate");
const result = document.getElementById("result");

button.addEventListener("click", async () => {
    button.disabled = true;
    button.textContent = "Generating...";
    result.textContent = "";

    try {
        const response = await fetch("YOUR_BACKEND_URL/generate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            }
        });

        if (!response.ok) {
            throw new Error(`Server returned ${response.status}`);
        }

        const data = await response.json();

        result.innerHTML = `
            <p><strong>Result:</strong> ${data.result ?? "Completed"}</p>
        `;

    } catch (error) {
        console.error(error);

        result.innerHTML = `
            <p class="error">
                Could not contact the backend.<br>
                ${error.message}
            </p>
        `;
    } finally {
        button.disabled = false;
        button.textContent = "Generate";
    }
});
</script>

</body>
</html>
